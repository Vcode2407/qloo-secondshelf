name: Verify SecondShelf
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-workflow:
    name: Node 22 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Provider fixtures are stubs. This workflow has no key and does not prove live Qloo use.
  hosted-worker:
    name: Hosted Worker clean build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hosting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hosting/package-lock.json
      - run: npm run install:ci
      - run: node --test test/*.test.js
      - run: npm run build
      # No hosting credential or provider key; validates compilation, not live Qloo.
